[package]
name = "nanorix-verify-types"
description = "Shared verification result types — the FailureReason wire form shared by the Nanorix API and the offline verifier"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "nanorix_verify_types"
path = "src/lib.rs"

[dependencies]
# Pure-types crate — only serde + thiserror. No runtime deps. No tokio,
# no SDK transitives. Forever-Standard wire-form ground truth lives here;
# the reference server implementation and tools/nanorix-verify both import from this crate to
# stay byte-identical on the FailureReason JSON shape.
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# Property-based testing for chain-walk invariants. Aurora-class
# P0 prevention surface —
# chain-walk's cycle / depth-limit / customer-id binding / cache invariants
# are exhausted at >=10k iterations each. Pinned at major-version 1; patch
# updates auto. Rust 1.85 ceiling honored (proptest 1.x MSRV is 1.65).
proptest = { workspace = true }

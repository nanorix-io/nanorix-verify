[workspace]
members = ["governance/verify-types", "tools/nanorix-verify"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"
authors = ["Nanorix Inc."]
license = "Apache-2.0"
repository = "https://github.com/nanorix-io/nanorix-verify"
publish = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
colored = "2"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
proptest = "1"
